<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИТ-М — промо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #2f8f4f;
      --green-deep: #1a5f32;
      --ink: #07140c;
      --mist: #d9ebe0;
      --soft: #9fbfab;
      --white: #f7fbf8;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #050a07;
      color: var(--white);
      font-family: "Manrope", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      gap: 28px;
    }

    .toolbar {
      width: min(1080px, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      color: var(--soft);
      font-size: 13px;
    }
    .toolbar button, .toolbar a {
      appearance: none;
      border: 1px solid rgba(47, 143, 79, 0.45);
      background: rgba(26, 95, 50, 0.35);
      color: var(--white);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .toolbar button:hover, .toolbar a:hover {
      background: rgba(47, 143, 79, 0.45);
    }

    /* ===== Square promo (Instagram / VK) ===== */
    .poster {
      --w: min(1080px, 92vw);
      width: var(--w);
      height: var(--w);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(47, 143, 79, 0.38), transparent 55%),
        radial-gradient(90% 70% at 80% 100%, rgba(26, 95, 50, 0.45), transparent 50%),
        linear-gradient(165deg, #0b1a11 0%, #07140c 42%, #102818 100%);
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.1), transparent 28%),
        repeating-linear-gradient(
          -18deg,
          transparent 0 18px,
          rgba(255, 255, 255, 0.015) 18px 19px
        );
      animation: drift 14s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    /* Soft arched window echo */
    .window-echo {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 72%;
      height: 78%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 48% 48% 12% 12% / 38% 38% 10% 10%;
      box-shadow: inset 0 0 80px rgba(47, 143, 79, 0.12);
      opacity: 0.55;
      z-index: 0;
      animation: breathe 7s ease-in-out infinite;
    }
    .window-echo::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: inherit;
    }

    .poster-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* Safe area for Max circular crop */
      padding: 18%;
      gap: clamp(16px, 2.6vw, 28px);
    }

    .logo-wrap {
      width: clamp(120px, 22vw, 220px);
      height: clamp(120px, 22vw, 220px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45));
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    .brand {
      margin: 0;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(42px, 9vw, 96px);
      line-height: 0.95;
      color: var(--white);
      animation: rise 1.2s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .brand span { color: #7ddea0; }

    .headline {
      margin: 0;
      max-width: 16ch;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(28px, 4.8vw, 52px);
      line-height: 1.15;
      color: var(--mist);
      animation: rise 1.25s .16s cubic-bezier(.2,.8,.2,1) both;
    }

    .support {
      margin: 0;
      max-width: 28ch;
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--soft);
      animation: rise 1.3s .24s cubic-bezier(.2,.8,.2,1) both;
    }

    .line {
      width: clamp(48px, 8vw, 88px);
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      animation: rise 1.2s .2s cubic-bezier(.2,.8,.2,1) both;
    }

    .footer-note {
      margin: 0;
      text-align: center;
      font-size: clamp(12px, 1.45vw, 16px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(159, 191, 171, 0.85);
      animation: rise 1.35s .3s cubic-bezier(.2,.8,.2,1) both;
    }

    /* Landscape variant for feed cover */
    .poster.landscape {
      --w: min(1200px, 96vw);
      width: var(--w);
      height: calc(var(--w) * 0.525);
      border-radius: 22px;
    }
    .poster.landscape .poster-inner {
      flex-direction: row;
      text-align: left;
      justify-content: flex-start;
      padding: 6% 7%;
      gap: clamp(28px, 5vw, 64px);
    }
    .poster.landscape .copy {
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.6vw, 18px);
      align-items: flex-start;
    }
    .poster.landscape .headline { max-width: 14ch; }
    .poster.landscape .poster-inner { padding: 6% 7%; }
    .poster.landscape .footer-note { text-align: left; }
    .poster.landscape .window-echo {
      left: 72%;
      top: 50%;
      width: 58%;
      height: 110%;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes drift {
      from { transform: translate3d(-1.5%, -1%, 0) scale(1.02); }
      to { transform: translate3d(1.5%, 1%, 0) scale(1.06); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.65; transform: translate(-50%, -50%) scale(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      .poster::before, .window-echo, .logo-wrap, .brand, .headline, .support, .line, .footer-note {
        animation: none !important;
      }
    }

    @media print {
      body { background: #000; padding: 0; }
      .toolbar { display: none; }
      .poster { box-shadow: none; border-radius: 0; width: 100vw; height: 100vw; page-break-after: always; }
      .poster.landscape { height: 52.5vw; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>Промо ИТ-М · откройте и сделайте скриншот / печать в PDF</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" onclick="window.print()">Печать / PDF</button>
      <a href="../img/logo-mark.png" download>Логотип PNG</a>
    </div>
  </div>

  <!-- Square -->
  <section class="poster" aria-label="Промо ИТ-М квадрат">
    <div class="window-echo" aria-hidden="true"></div>
    <div class="poster-inner">
      <div class="logo-wrap">
        <img src="../img/logo-mark.png" width="220" height="220" alt="ИТ-М">
      </div>
      <h1 class="brand">ИТ<span>-</span>М</h1>
      <div class="line" aria-hidden="true"></div>
      <p class="headline">Цифровая мастерская</p>
      <p class="support">Статусы в Max — Низкие цены</p>
      <div class="footer-note">новый уровень доверия</div>
    </div>
  </section>

  <!-- Landscape -->
  <section class="poster landscape" aria-label="Промо ИТ-М обложка">
    <div class="window-echo" aria-hidden="true"></div>
    <div class="poster-inner">
      <div class="logo-wrap">
        <img src="../img/logo-mark.png" width="220" height="220" alt="ИТ-М">
      </div>
      <div class="copy">
        <h1 class="brand">ИТ<span>-</span>М</h1>
        <div class="line" aria-hidden="true"></div>
        <p class="headline">Цифровая мастерская</p>
        <p class="support">Статусы в Max — Низкие цены</p>
      </div>
      <div class="footer-note">новый уровень доверия</div>
    </div>
  </section>
</body>
</html>
